aid: alpen-labs
name: Alpen Labs
description: >-
  Alpen Labs is a Bitcoin infrastructure company building Alpen (formerly Strata), an
  EVM-compatible zero-knowledge validity rollup on Bitcoin that lets developers deploy
  standard Solidity smart contracts and applications settled to the Bitcoin base layer.
  The developer surface is a public JSON-RPC interface: an Ethereum-compatible full node
  exposing standard eth_* methods, twenty-five Strata-specific strata_* methods, and an
  ERC-4337 account-abstraction bundler (EIP-7769). Developers get a testnet (chain ID
  8150, Signet BTC), a PoW faucet, a block/checkpoint explorer, and the first-party Rust
  alpen CLI for wallet, deposit, withdraw and bridge operations. Backed by Ribbit Capital.
